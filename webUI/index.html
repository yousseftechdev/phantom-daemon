<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>phantom_daemon // proc watch</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #06080a;
      --panel-bg: #0b0e0d;
      --border: #1a201c;
      --border-bright: #3c463f;
      --text: #d3ddd0;
      --text-dim: #5c6a5f;
      --accent: #8fbf8f;
      --accent-alt: #cfd4c2;
      --warn: #d9a545;
      --crit: #c1544a;
      --font-display: 'Space Mono', monospace;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0px !important;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 22px;
      gap: 20px;
      position: relative;
    }

    /* faint scanline texture — kept deliberately subtle */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.018) 0px,
        rgba(255, 255, 255, 0.018) 1px,
        transparent 1px,
        transparent 3px
      );
      z-index: 50;
      mix-blend-mode: overlay;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border-bright);
      padding-bottom: 14px;
    }

    .brand-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2.5px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      text-transform: lowercase;
    }

    .cursor-blink {
      display: inline-block;
      color: var(--accent);
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .session-line {
      font-size: 10.5px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .session-line span {
      color: var(--accent);
    }

    .status-block {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 10.5px;
      letter-spacing: 1.5px;
      font-family: var(--font-mono);
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      background: var(--text-dim);
      border: 1px solid var(--border-bright);
    }

    .status-indicator.connected {
      background: var(--accent);
      box-shadow: 0 0 6px rgba(143, 191, 143, 0.6);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      grid-template-rows: 1fr 132px;
      gap: 20px;
      min-height: 0;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .panel-hero {
      border-color: var(--border-bright);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      gap: 12px;
    }

    .panel-title {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: var(--text);
      text-transform: uppercase;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .panel-tag {
      font-family: var(--font-display);
      font-size: 10px;
      color: var(--accent);
      opacity: 0.85;
    }

    .metric-readout {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 400;
      white-space: nowrap;
    }

    .metric-readout b {
      color: var(--accent);
      font-weight: 700;
    }

    .graph-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
    }

    .graph-tooltip {
      position: absolute;
      pointer-events: none;
      background-color: #050605;
      border: 1px solid var(--border-bright);
      padding: 5px 9px;
      color: var(--text);
      font-size: 10.5px;
      z-index: 10;
      display: none;
    }

    .secondary-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .mini-panel {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .full-width {
      grid-column: span 2;
    }

    .core-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
      gap: 7px;
      height: 100%;
    }

    .core-node {
      border: 1px solid var(--border);
      padding: 7px 8px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.15s ease;
    }

    .core-node:hover {
      border-color: var(--border-bright);
    }

    .core-label {
      font-size: 8.5px;
      color: var(--text-dim);
      letter-spacing: 1px;
      font-family: var(--font-mono);
    }

    .core-val {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-top: 3px;
      font-family: var(--font-mono);
    }

    .core-bar-track {
      height: 2px;
      background: var(--border);
      margin-top: 6px;
      width: 100%;
    }

    .core-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.12s linear, background-color 0.2s ease;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-blink { animation: none; opacity: 1; }
      body::after { display: none; }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand-group">
      <div class="brand-sub">local proc watch · ws://127.0.0.1:8765</div>
      <h1>phantom_daemon<span class="cursor-blink">_</span></h1>
    </div>
    <div class="status-block">
      <div id="statusDot" class="status-indicator"></div>
      <span id="connStatus">SOCKET CLOSED</span>
    </div>
  </header>

  <main>
    <div class="panel panel-hero">
      <div class="panel-header">
        <div class="panel-title"><span class="panel-tag">01</span>processor &amp; temp</div>
        <div class="metric-readout">
          cpu <b id="cpuVal">0%</b> &nbsp;/&nbsp; pkg <b id="tempVal">--°C</b>
        </div>
      </div>
      <div class="graph-wrapper">
        <canvas id="cpuGraph"></canvas>
        <div id="cpuTooltip" class="graph-tooltip"></div>
      </div>
    </div>

    <div class="secondary-stack">
      <div class="mini-panel">
        <div class="panel-header">
          <div class="panel-title"><span class="panel-tag">02</span>memory</div>
          <div class="metric-readout"><b id="ramVal">0%</b></div>
        </div>
        <div class="graph-wrapper">
          <canvas id="ramGraph"></canvas>
          <div id="ramTooltip" class="graph-tooltip"></div>
        </div>
      </div>

      <div class="mini-panel">
        <div class="panel-header">
          <div class="panel-title"><span class="panel-tag">03</span>network</div>
          <div class="metric-readout"><b id="netVal">0 KB/s</b></div>
        </div>
        <div class="graph-wrapper">
          <canvas id="netGraph"></canvas>
          <div id="netTooltip" class="graph-tooltip"></div>
        </div>
      </div>

      <div class="mini-panel">
        <div class="panel-header">
          <div class="panel-title"><span class="panel-tag">04</span>disk io</div>
          <div class="metric-readout"><b id="diskVal">0 MB/s</b></div>
        </div>
        <div class="graph-wrapper">
          <canvas id="diskGraph"></canvas>
          <div id="diskTooltip" class="graph-tooltip"></div>
        </div>
      </div>
    </div>

    <div class="panel full-width">
      <div class="panel-header">
        <div class="panel-title"><span class="panel-tag">05</span>core topology, load by thread</div>
      </div>
      <div id="coreGrid" class="core-container"></div>
    </div>
  </main>

  <script>
    function loadColor(pct) {
      if (pct >= 85) return '#c1544a';
      if (pct >= 60) return '#d9a545';
      return '#8fbf8f';
    }

    class TimeSeriesGraph {
      constructor(canvas, tooltipEl, maxPoints = 60, yMin = 0, yMax = 100, autoScale = false, unit = '') {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.tooltip = tooltipEl;
        this.maxPoints = maxPoints;
        this.yMin = yMin;
        this.yMax = yMax;
        this.autoScale = autoScale;
        this.unit = unit;
        this.series = [];
        this.hoverX = null;
        this.lastFrameTime = performance.now();

        this.canvas.addEventListener('mousemove', (e) => {
          const rect = this.canvas.getBoundingClientRect();
          this.hoverX = e.clientX - rect.left;
        });

        this.canvas.addEventListener('mouseleave', () => {
          this.hoverX = null;
          if (this.tooltip) this.tooltip.style.display = 'none';
        });
      }

      addSeries(label, color, fill = false) {
        const s = {
          label: label,
          color: color,
          fill: fill,
          currentData: new Array(this.maxPoints).fill(0),
          targetData: new Array(this.maxPoints).fill(0)
        };
        this.series.push(s);
        return this.series.length - 1;
      }

      pushData(seriesIndex, value) {
        if (this.series[seriesIndex]) {
          this.series[seriesIndex].targetData.push(value);
          if (this.series[seriesIndex].targetData.length > this.maxPoints) {
            this.series[seriesIndex].targetData.shift();
          }
          while (this.series[seriesIndex].currentData.length < this.series[seriesIndex].targetData.length) {
            this.series[seriesIndex].currentData.push(value);
          }
          while (this.series[seriesIndex].currentData.length > this.maxPoints) {
            this.series[seriesIndex].currentData.shift();
          }
        }

        if (this.autoScale) {
          let maxObserved = 10;
          this.series.forEach(s => {
            const sMax = Math.max(...s.targetData);
            if (sMax > maxObserved) maxObserved = sMax;
          });
          this.yMax = maxObserved * 1.2;
        }
      }

      resize() {
        if (!this.canvas.parentElement) return;
        this.canvas.width = this.canvas.parentElement.clientWidth;
        this.canvas.height = this.canvas.parentElement.clientHeight;
      }

      updateInterpolation() {
        const now = performance.now();
        const dt = Math.min((now - this.lastFrameTime) / 1000, 0.1);
        this.lastFrameTime = now;
        const rate = 7; // higher = snappier, lower = silkier
        const factor = 1 - Math.exp(-rate * dt);

        this.series.forEach(s => {
          for (let i = 0; i < s.targetData.length; i++) {
            s.currentData[i] += (s.targetData[i] - s.currentData[i]) * factor;
          }
        });
      }

      _tracePath(points) {
        this.ctx.beginPath();
        if (points.length < 2) return;
        this.ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length - 1; i++) {
          const midX = (points[i].x + points[i + 1].x) / 2;
          const midY = (points[i].y + points[i + 1].y) / 2;
          this.ctx.quadraticCurveTo(points[i].x, points[i].y, midX, midY);
        }
        const last = points[points.length - 1];
        this.ctx.lineTo(last.x, last.y);
      }

      draw() {
        this.updateInterpolation();
        const w = this.canvas.width;
        const h = this.canvas.height;
        this.ctx.clearRect(0, 0, w, h);

        this.ctx.strokeStyle = '#12160f';
        this.ctx.lineWidth = 1;
        this.ctx.beginPath();
        for (let y = 0; y <= h; y += h / 3) {
          this.ctx.moveTo(0, y);
          this.ctx.lineTo(w, y);
        }
        for (let x = 0; x <= w; x += w / 6) {
          this.ctx.moveTo(x, 0);
          this.ctx.lineTo(x, h);
        }
        this.ctx.stroke();

        const step = w / (this.maxPoints - 1);

        this.series.forEach(s => {
          if (s.currentData.length < 2) return;

          const points = s.currentData.map((val, i) => {
            const norm = (val - this.yMin) / (this.yMax - this.yMin || 1);
            const clamped = Math.max(0, Math.min(1, norm));
            return { x: i * step, y: h - (clamped * h) };
          });

          this._tracePath(points);
          this.ctx.strokeStyle = s.color;
          this.ctx.lineWidth = 1.4;
          this.ctx.lineJoin = 'round';
          this.ctx.stroke();

          if (s.fill) {
            this.ctx.lineTo(w, h);
            this.ctx.lineTo(0, h);
            this.ctx.closePath();
            this.ctx.fillStyle = s.color + '14';
            this.ctx.fill();
          }
        });

        if (this.hoverX !== null) {
          const hoveredIndex = Math.round(this.hoverX / step);
          const clampedIndex = Math.max(0, Math.min(this.maxPoints - 1, hoveredIndex));
          const snapX = clampedIndex * step;

          this.ctx.strokeStyle = 'rgba(211, 221, 208, 0.3)';
          this.ctx.lineWidth = 1;
          this.ctx.setLineDash([2, 2]);
          this.ctx.beginPath();
          this.ctx.moveTo(snapX, 0);
          this.ctx.lineTo(snapX, h);
          this.ctx.stroke();
          this.ctx.setLineDash([]);

          let tooltipText = [];

          this.series.forEach(s => {
            const rawVal = s.targetData[clampedIndex] !== undefined ? s.targetData[clampedIndex] : 0;
            const norm = (s.currentData[clampedIndex] - this.yMin) / (this.yMax - this.yMin || 1);
            const snapY = h - (Math.max(0, Math.min(1, norm)) * h);

            this.ctx.fillStyle = s.color;
            this.ctx.beginPath();
            this.ctx.arc(snapX, snapY, 3.5, 0, Math.PI * 2);
            this.ctx.fill();

            tooltipText.push(`${s.label}: <b>${rawVal}${this.unit}</b>`);
          });

          if (this.tooltip) {
            this.tooltip.style.display = 'block';
            this.tooltip.innerHTML = tooltipText.join('<br>');

            const tooltipWidth = this.tooltip.offsetWidth;
            const tooltipX = snapX + tooltipWidth + 12 > w ? snapX - tooltipWidth - 12 : snapX + 12;

            this.tooltip.style.left = `${tooltipX}px`;
            this.tooltip.style.top = `10px`;
          }
        }
      }
    }

    const graphs = {
      cpu: new TimeSeriesGraph(document.getElementById('cpuGraph'), document.getElementById('cpuTooltip'), 80, 0, 100, false, ''),
      ram: new TimeSeriesGraph(document.getElementById('ramGraph'), document.getElementById('ramTooltip'), 50, 0, 100, false, '%'),
      net: new TimeSeriesGraph(document.getElementById('netGraph'), document.getElementById('netTooltip'), 50, 0, 100, true, ' KB/s'),
      disk: new TimeSeriesGraph(document.getElementById('diskGraph'), document.getElementById('diskTooltip'), 50, 0, 10, true, ' MB/s')
    };

    const cpuSeriesIdx = graphs.cpu.addSeries('cpu load', '#8fbf8f', true);
    const tempSeriesIdx = graphs.cpu.addSeries('temp', '#cfd4c2', false);
    const ramSeriesIdx = graphs.ram.addSeries('ram usage', '#8fbf8f', true);
    const rxSeriesIdx = graphs.net.addSeries('down', '#8fbf8f', true);
    const txSeriesIdx = graphs.net.addSeries('up', '#cfd4c2', false);
    const readSeriesIdx = graphs.disk.addSeries('read', '#8fbf8f', true);
    const writeSeriesIdx = graphs.disk.addSeries('write', '#cfd4c2', false);

    function resizeAll() {
      Object.values(graphs).forEach(g => g.resize());
    }
    window.addEventListener('resize', resizeAll);
    setTimeout(resizeAll, 50);

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      Object.values(graphs).forEach(g => g.draw());
    }
    renderLoop();

    const ws = new WebSocket('ws://127.0.0.1:8765');
    const connStatus = document.getElementById('connStatus');
    const statusDot = document.getElementById('statusDot');
    const coreGrid = document.getElementById('coreGrid');

    const cpuVal = document.getElementById('cpuVal');
    const tempVal = document.getElementById('tempVal');
    const ramVal = document.getElementById('ramVal');
    const netVal = document.getElementById('netVal');
    const diskVal = document.getElementById('diskVal');

    ws.onopen = () => {
      connStatus.textContent = 'SOCKET OPEN';
      statusDot.classList.add('connected');
    };

    ws.onclose = () => {
      connStatus.textContent = 'SOCKET CLOSED';
      statusDot.classList.remove('connected');
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      graphs.cpu.pushData(cpuSeriesIdx, data.cpu.total);
      if (data.temperature && data.temperature.package !== null) {
        graphs.cpu.pushData(tempSeriesIdx, data.temperature.package);
        tempVal.textContent = `${data.temperature.package}°C`;
      }

      graphs.ram.pushData(ramSeriesIdx, data.ram.percent);
      graphs.net.pushData(rxSeriesIdx, data.network.rx_kbps);
      graphs.net.pushData(txSeriesIdx, data.network.tx_kbps);
      graphs.disk.pushData(readSeriesIdx, data.disk.read_mbps);
      graphs.disk.pushData(writeSeriesIdx, data.disk.write_mbps);

      cpuVal.textContent = `${data.cpu.total}%`;
      ramVal.textContent = `${data.ram.percent}%`;
      netVal.textContent = `${data.network.rx_kbps} KB/s`;
      diskVal.textContent = `${data.disk.read_mbps} MB/s`;

      if (coreGrid.children.length !== data.cpu.cores.length) {
        coreGrid.innerHTML = '';
        data.cpu.cores.forEach((_, i) => {
          const div = document.createElement('div');
          div.className = 'core-node';
          div.innerHTML = `
            <div class="core-label">thread ${String(i).padStart(2, '0')}</div>
            <div class="core-val" id="coreVal${i}">0%</div>
            <div class="core-bar-track"><div id="coreBar${i}" class="core-bar-fill"></div></div>
          `;
          coreGrid.appendChild(div);
        });
      }

      data.cpu.cores.forEach((val, i) => {
        const valElem = document.getElementById(`coreVal${i}`);
        const barElem = document.getElementById(`coreBar${i}`);
        if (valElem) valElem.textContent = `${val}%`;
        if (barElem) {
          barElem.style.width = `${val}%`;
          barElem.style.backgroundColor = loadColor(val);
        }
      });
    };
  </script>
</body>

</html>
